<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f0a">
<title>The Scattering — slice 1 playtest</title>
<style>:root {
  --bg: #0a0f0a;
  --bg2: #0e150e;
  --ink: #c9d6c0;
  --dim: #6b7f62;
  --acc: #9ae66e;
  --warn: #e6c66e;
  --bad: #e66e6e;
  --sys: #6ec8e6;
  --line: #1e2b1e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  font-size: 16px; line-height: 1.5;
  overscroll-behavior: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
#screen { flex: 1; padding: 20px 16px 32px; }
.hidden { display: none !important; }

/* terminal chrome */
.term-bar { color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 16px; display: flex; justify-content: space-between; }
h1.title { color: var(--acc); font-size: 28px; letter-spacing: 2px; margin: 24px 0 4px; }
.subtitle { color: var(--dim); margin-bottom: 32px; }
.ascii { color: var(--dim); font-size: 12px; line-height: 1.3; white-space: pre; margin: 16px 0; }

/* buttons: big touch targets */
.btn {
  display: block; width: 100%; padding: 16px; margin: 10px 0;
  background: var(--bg2); color: var(--acc); border: 1px solid var(--acc);
  font: inherit; font-size: 17px; text-align: center; cursor: pointer; border-radius: 4px;
}
.btn:active { background: var(--acc); color: var(--bg); }
.btn.ghost { border-color: var(--dim); color: var(--dim); }
.btn:disabled { opacity: .35; }

/* stat bars */
.stat { margin: 8px 0; }
.stat .lbl { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--acc); transition: width .3s; }
.bar.low > i { background: var(--warn); }
.bar.crit > i { background: var(--bad); }

/* log */
#log { border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-height: 120px; max-height: 32dvh; overflow-y: auto; font-size: 14px; }
#log p { margin: 6px 0; }
#log .sys { color: var(--sys); }
#log .bad { color: var(--bad); }
#log .good { color: var(--acc); }

#toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
  background: var(--bg2); border: 1px solid var(--acc); color: var(--ink);
  padding: 12px 20px; border-radius: 4px; font-size: 14px; z-index: 50;
}
.card { border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin: 10px 0; background: var(--bg2); }
.card h3 { margin: 0 0 6px; color: var(--acc); font-size: 16px; }
.card p { margin: 4px 0; font-size: 14px; color: var(--dim); }
.card.warn { border-color: var(--warn); }
.card.warn h3 { color: var(--warn); }
.card.codex { border-left: 3px solid var(--warn); }
.card.codex p { color: var(--ink); font-style: italic; }
.row { display: flex; gap: 10px; }
.row .btn { margin: 5px 0; }
.small { font-size: 13px; color: var(--dim); }
.term-line { font-size: 14px; margin: 6px 0; color: var(--ink); }

/* map */
.map { margin: 12px 0; border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--bg2); }
.mrow { display: flex; }
.tile {
  flex: 1; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--dim); border: 1px solid transparent; border-radius: 4px;
  cursor: pointer; user-select: none; min-height: 40px;
}
.tile.fog { color: #2a362a; }
.tile.me { color: var(--bg); background: var(--acc); font-weight: bold; }
.tile.move { border-color: var(--acc); color: var(--acc); }
.tile:active { background: var(--line); }

/* action rows */
.actions { display: flex; gap: 8px; margin: 8px 0; }
.actions .btn.sm { margin: 0; padding: 14px 8px; font-size: 15px; flex: 1; }
.linklike { background: none; border: none; color: var(--acc); font: inherit; font-size: 14px; cursor: pointer; text-decoration: underline; padding: 4px; }

/* log */
.log { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-top: 12px; max-height: 28dvh; overflow-y: auto; background: var(--bg); }
</style>
</head>
<body>

  const MOVES = {

    trample: { name: 'Trample', dmg: [8, 14], hint: 'It whirls, lashing out at everything close.' },

      log.push('You STUDY it. The Codex drinks in the details.');

      } else {

        t.foraged = true;
        const r = S.forage.forage(t, this.biome(), this.data.plants, scholar, this.state.codex, this.data.abilities);
        if (r.firstFind) this.state.codex.plants[r.plantId] = { identifiedDay: scholar.day };
        scholar.inventory.push({ plantId: r.plantId, units: r.units, kcalEach: r.plant.caloriesPerUnit, spoilDay: scholar.day + (r.plant.spoilageDays || 2), name: r.plant.name, unit: r.plant.unit, prep: r.plant.preparation });
        scholar.kcal -= S.calories.ACTION_COSTS.forage;
        msg = r.message + (r.firstFind ? ` (${r.plant.codex})` : '');
      } else if (kind === 'rest') {
        scholar.energy = Math.min(100, scholar.energy + 30);
        scholar.health = Math.min(100, scholar.health + 5);
        scholar.kcal -= 50;
        msg = 'You rest. Breath slows. +30 energy.';
      } else if (kind === 'treat') {
        const t = this.playerTile();
        if (t.type !== 'creek' && t.type !== 'wetland') { this.say('Need moving water — find a creek or wetland.'); return null; }
        scholar.water = (scholar.water || 0) + 2;
        scholar.kcal -= S.calories.ACTION_COSTS.treat_water;
        msg = 'You boil water over a small fire. +2 clean water.';
      }
      this.ap -= 1;
      this.say(msg);
      return msg;
    },

    // --- free minors ---
    eat() {
      const scholar = this.state.scholar;
      if (this.over) return;
      // eat most-perishable first until kcal >= 2400 or empty
      scholar.inventory.sort((a, b) => a.spoilDay - b.spoilDay);
      let ate = 0;
      while (scholar.kcal < 2400 && scholar.inventory.length) {
        const it = scholar.inventory[0];
        const kcal = it.kcalEach;
        scholar.kcal += kcal; ate += kcal;
        it.units -= 1;
        if (it.units <= 0) scholar.inventory.shift();
      }
      // spoilage: drop expired
      const before = scholar.inventory.length;
      scholar.inventory = scholar.inventory.filter(i => i.spoilDay > scholar.day);
      const spoiled = before - scholar.inventory.length;
      this.say(ate > 0 ? `You eat (${ate} kcal).` + (spoiled ? ` ${spoiled} item(s) spoiled — the Codex notes the waste.` : '')
                       : (scholar.inventory.length ? 'You are full enough.' : 'Nothing to eat. The pantry of your pack is empty.'));
    },

    drinkTreated() {
      const scholar = this.state.scholar;
      if ((scholar.water || 0) < 1) { this.say('No clean water. Treat some at a creek.'); return; }
      scholar.water -= 1;
      scholar.hydration = Math.min(100, scholar.hydration + 50);
      this.say('You drink clean water. +50 hydration.');
    },

    drinkWild() {
      const scholar = this.state.scholar;
      const t = this.playerTile();
      if (t.type !== 'creek' && t.type !== 'wetland') { this.say('No water here.'); return; }
      scholar.hydration = Math.min(100, scholar.hydration + 40);
      if (Math.random() < 0.15) {
        scholar.health -= 10;
        this.say('You drink from the creek. +40 hydration. Your stomach turns — untreated water is a gamble. (-10 health)');
      } else this.say('You drink from the creek. +40 hydration. (Untreated — a gamble.)');
    },

    endDayPart() {
      if (this.over) return this.status();
      // small energy tick per part
      this.state.scholar.energy = Math.max(0, this.state.scholar.energy - 5);
      this.dayPart += 1;
      if (this.dayPart >= 4) return this.endDay();
      this.ap = 1;
      this.say(`— ${DAY_PARTS[this.dayPart].toUpperCase()} — ${DAY_PART_HINT[DAY_PARTS[this.dayPart]]}`);
      return this.status();
    },

    endDay() {
      const scholar = this.state.scholar;
      // reset forage flags
      for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) this.map.tiles[y][x].foraged = false;
      // evening: auto-eat prompt handled by UI; run metabolism
      const res = S.calories.resolveDay(scholar, this.state.village);
      res.warnings.forEach(w => this.say('⚠ ' + w));
      S.state.save(this.state);
      if (!res.ok || scholar.health <= 0) {
        this.over = true;
        this.say('You didn\'t make it. The village remembers. The Codex keeps what you brought home.');
        return this.status();
      }
      if (scholar.day >= 7) {
        this.over = true; this.won = true;
        this.say('Seven days. You ate, you drank, you came back. The village eats because of you.');
        return this.status();
      }
      scholar.day += 1;
      this.dayPart = 0; this.ap = 1;
      this.say(`— DAY ${scholar.day} DAWN — ${DAY_PART_HINT.dawn}`);
      return this.status();
    },

    // --- combat ---
    startCombat() {
      const monster = this.data.monsters.find(m => m.id === 'thornback_boar') || this.data.monsters[0];
      this.fight = S.combat.newFight(monster, this.state.scholar);
      this.pendingEncounter = false;
      this.say(`A BULLDOZER crashes from the thicket — ${monster.codexStages.unknown}`);
      return this.fight;
    },

    combatRound(cmd) {
      const r = S.combat.round(this.fight, cmd, this.state.scholar, this.data.abilities);
      r.log.forEach(l => this.say(l));
      this.state.scholar.health = Math.max(0, this.fight.scholarHp);
      if (cmd === 'study' && !this.state.codex.monsters) this.state.codex.monsters = {};
      if (cmd === 'study') this.state.codex.monsters['thornback_boar'] = { stage: 'observed' };
      if (r.result === 'won') {
        this.state.codex.monsters = this.state.codex.monsters || {};
        this.state.codex.monsters['thornback_boar'] = { stage: 'slain' };
        const scholar = this.state.scholar;
        scholar.inventory.push({ plantId: 'boar_meat', units: 4, kcalEach: 800, spoilDay: scholar.day + 3, name: 'Bulldozer meat', unit: 'cut', prep: 'Smoke it — it keeps for weeks.' });
        this.say('The Bulldozer falls. Pork is pork — 3,200 kcal of it. The village will eat. (+4 cuts of meat)');
        this.fight = null;
      } else if (r.result === 'fled') {
        this.fight = null;
        this.say('You escape. The thicket keeps its secrets.');
      } else if (r.result === 'lost') {
        this.over = true; this.fight = null;
        this.say('The Bulldozer does not go around. You didn\'t make it. The village remembers.');
      }
      if (this.state.scholar.health <= 0 && !this.over) { this.over = true; this.say('You didn\'t make it.'); }
      return r;
    },

    say(msg) { this.log.push(msg); if (this.log.length > 40) this.log.shift(); },

    status() {
      const s = this.state.scholar;
      return {
        day: s.day, dayPart: DAY_PARTS[this.dayPart], dayPartHint: DAY_PART_HINT[DAY_PARTS[this.dayPart]],
        ap: this.ap, health: Math.round(s.health), kcal: Math.round(s.kcal),
        hydration: Math.round(s.hydration), energy: Math.round(s.energy),
        water: s.water || 0,
        inventory: s.inventory.map(i => ({ name: i.name, units: i.units, kcalEach: i.kcalEach, spoilDay: i.spoilDay })),
        invKcal: s.inventory.reduce((t, i) => t + i.units * i.kcalEach, 0),
        px: this.map.px, py: this.map.py,
        over: this.over, won: this.won,
        inCombat: !!this.fight,
        pendingEncounter: !!this.pendingEncounter,
        log: this.log.slice(-6),
        codexCount: Object.keys(this.state.codex.plants).length,
        abilities: s.abilities,
      };
    },

    codexEntries() {
      return Object.keys(this.state.codex.plants).map(pid => {
        const p = this.data.plants.find(x => x.id === pid);
        return p ? { name: p.name, kcal: p.caloriesPerUnit, unit: p.unit, prep: p.preparation, text: p.codex } : null;
      }).filter(Boolean);
    },
  };

  global.Scattering = global.Scattering || {};
  global.Scattering.Game = Game;
  global.Scattering.DAY_PARTS = DAY_PARTS;
  global.Scattering.TILE_GLYPH = TILE_GLYPH;
  global.Scattering.TILE_NAME = TILE_NAME;
})(typeof window !== 'undefined' ? window : globalThis);

/* The Scattering — slice 1: "Seven Days" playable.
   Screens: title → onboarding → game (map/day loop) → combat → codex → ending. */
(function () {
  'use strict';
  const S = window.Scattering;
  const Game = S.Game;
  const screen = document.getElementById('screen');
  const toastEl = document.getElementById('toast');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.add('hidden'), 2400);
  }
  function bar(left, right) {
    return `<div class="term-bar"><span>${left}</span><span>${right}</span></div>`;
  }
  function esc(s) { return String(s).replace(/</g, '&lt;'); }

  // ---------- shared ----------
  function statRow(label, val, pct, low) {
    return `<div class="stat"><div class="lbl"><span>${label}</span><span>${val}</span></div><div class="bar${low ? ' low' : ''}"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div></div>`;
  }
  function statusBars(st) {
    return statRow('HEALTH', st.health, st.health, st.health < 35) +
      statRow('FOOD (you)', Math.round(st.kcal) + ' kcal', st.kcal / 24, st.kcal < 500) +
      statRow('PACK', st.invKcal + ' kcal', Math.min(100, st.invKcal / 30)) +
      statRow('WATER', st.hydration + '% · ' + st.water + ' clean', st.hydration, st.hydration < 30) +
      statRow('ENERGY', st.energy + '%', st.energy, st.energy < 25);
  }

  // ---------- title ----------
  function title() {
    screen.innerHTML = `
      ${bar('scattering://village', 'day 0')}
      <div class="ascii">      .-""-.
     / .--. \\
    | (    ) |
     \\ '--' /
      '--'--'</div>
      <h1 class="title">THE SCATTERING</h1>
      <div class="subtitle">a system-apocalypse survival roguelite<br>hunger is the final boss</div>
      <button class="btn" id="b-new">New Expedition</button>
      <button class="btn ghost" id="b-codex0">Codex</button>
      <button class="btn ghost" id="b-about">About</button>
      <p class="small" style="margin-top:20px">slice 1: seven days. forage · eat · drink · survive.</p>`;
    document.getElementById('b-new').onclick = () => obColdOpen();
    document.getElementById('b-codex0').onclick = () => { toast('The Codex is empty. For now.'); };
    document.getElementById('b-about').onclick = about;
  }
  function about() {
    screen.innerHTML = `${bar('scattering://about', 'v0.1')}
      <h1 class="title" style="font-size:22px">ABOUT</h1>
      <p class="small">The sky changed. You woke up somewhere else. All wiring and combustibles are gone — the Burn took them.</p>
      <p class="small">Keep yourself fed for seven days. The village is counting on you.</p>
      <button class="btn ghost" id="b-back">Back</button>`;
    document.getElementById('b-back').onclick = title;
  }

  // ---------- onboarding ----------
  let ob = {};
  function obColdOpen() {
    screen.innerHTML = `${bar('scattering://wake', '...')}
      <div style="margin:60px 0 30px;min-height:120px" id="ob-lines"></div>
      <button class="btn ghost" id="b-c1">...</button>`;
    const lines = ['The sky changed on a Tuesday.', 'You woke up somewhere else.'];
    const el = document.getElementById('ob-lines');
    let i = 0;
    document.getElementById('b-c1').onclick = () => {
      if (i < lines.length) { el.innerHTML += `<p class="term-line">${lines[i++]}</p>`; }
      if (i >= lines.length) obHome();
    };
  }
  function obHome() {
    const homes = [
      { id: 'ohio', label: 'Ohio river valley', sub: 'farms and small woods' },
      { id: 'georgia', label: 'Georgia pines', sub: 'hunting country' },
      { id: 'seattle', label: 'Seattle', sub: 'city, rain, salt water' },
    ];
    screen.innerHTML = `${bar('scattering://home', '?')}
      <h1 class="title" style="font-size:22px">WHERE IS HOME?</h1>
      <p class="small">What you know grows where you're from. It doesn't grow here.</p>
      ${homes.map(h => `<button class="btn" data-h="${h.id}">${h.label}<br><span class="small">${h.sub}</span></button>`).join('')}`;
    screen.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { ob.home = b.dataset.h; obWho(); });
  }
  function obWho() {
    const vs = Game.data.villagers;
    screen.innerHTML = `${bar('scattering://wake', 'clearing')}
      <h1 class="title" style="font-size:22px">WHICH ONE IS YOU?</h1>
      <p class="small">A clearing. Confused people waking up. One of them is you.</p>
      ${vs.map(v => `
        <div class="card"><h3>${v.name}</h3>
        <p>${v.formerOccupation} · ${v.homeRegion}</p>
        <p class="small">${v.backstory}</p>
        <button class="btn" data-v="${v.id}">I am ${v.name.split(' ')[0]}</button></div>`).join('')}`;
    screen.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { ob.villager = b.dataset.v; obItems(); });
  }
  function obItems() {
    const v = Game.data.villagers.find(x => x.id === ob.villager);
    const items = v.items.map(id => Game.data.items.find(i => i.id === id)).filter(Boolean);
    screen.innerHTML = `${bar('scattering://pack', '5 items')}
      <h1 class="title" style="font-size:22px">WHAT DID YOU GRAB?</h1>
      <p class="small">The sky was changing. ${v.name.split(' ')[0]} grabbed five things:</p>
      ${items.map(i => `<div class="card"><h3>${i.name}</h3><p class="small">${i.flavor}</p></div>`).join('')}
      <button class="btn" id="b-go">This is me. Begin.</button>`;
    document.getElementById('b-go').onclick = () => {
      Game.newGame(ob.home, ob.villager);
      gameMain(true);
    };
  }

  // ---------- main game ----------
  function gameMain(first) {
    const st = Game.status();
    if (st.over) return ending();
    if (st.pendingEncounter) return combatIntro();
    if (st.inCombat) return combatScreen();

    const t = Game.playerTile();
    const canForage = S.forage.canForage(t) && st.ap > 0;
    const canTreat = (t.type === 'creek' || t.type === 'wetland') && st.ap > 0;

    screen.innerHTML = `
      ${bar('scattering://field', `day ${st.day} · ${st.dayPart}`)}
      <p class="small">${st.dayPartHint}</p>
      ${statusBars(st)}
      <div class="map">${renderMap(st)}</div>
      <p class="small">📍 ${S.TILE_NAME[t.type]} · ${st.ap > 0 ? '1 action left' : 'no actions left'} — <button class="linklike" id="b-endpart">end ${st.dayPart} →</button></p>
      <div class="actions">
        ${st.ap > 0 ? `
        <button class="btn sm" id="a-forage" ${canForage ? '' : 'disabled'}>Forage</button>
        <button class="btn sm" id="a-treat" ${canTreat ? '' : 'disabled'}>Treat water</button>
        <button class="btn sm" id="a-rest">Rest</button>` : `<p class="small">Rest those hands. End the ${st.dayPart}.</p>`}
      </div>
      <div class="actions">
        <button class="btn sm ghost" id="a-eat">Eat to full</button>
        <button class="btn sm ghost" id="a-drink" ${st.water > 0 ? '' : 'disabled'}>Drink clean (${st.water})</button>
        <button class="btn sm ghost" id="a-wild" ${(t.type === 'creek' || t.type === 'wetland') ? '' : 'disabled'}>Drink wild</button>
        <button class="btn sm ghost" id="a-codex">Codex (${st.codexCount})</button>
      </div>
      <div class="log">${st.log.map(l => `<p class="term-line">${esc(l)}</p>`).join('')}</div>`;

    // map clicks
    screen.querySelectorAll('.tile').forEach(el => {
      el.onclick = () => {
        const x = +el.dataset.x, y = +el.dataset.y;
        if (Game.move(x, y)) gameMain();
        else toast('Too far — 3 tiles max, and only through scouted ground.');
      };
    });
    const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = () => { fn(); gameMain(); }; };
    on('a-forage', () => Game.doAction('forage'));
    on('a-treat', () => Game.doAction('treat'));
    on('a-rest', () => Game.doAction('rest'));
    on('a-eat', () => Game.eat());
    on('a-drink', () => Game.drinkTreated());
    on('a-wild', () => Game.drinkWild());
    document.getElementById('a-codex').onclick = codexScreen;
    document.getElementById('b-endpart').onclick = () => { Game.endDayPart(); gameMain(); };
    if (first) setTimeout(() => toast('"Eat something green. Drink water. Come back before dark."'), 600);
  }

  function renderMap(st) {
    let html = '';
    for (let y = 0; y < 7; y++) {
      html += '<div class="mrow">';
      for (let x = 0; x < 7; x++) {
        const tl = Game.tileAt(x, y);
        const isP = (x === st.px && y === st.py);
        const move = Game.canMove(x, y);
        const cls = 'tile' + (isP ? ' me' : '') + (tl.revealed ? '' : ' fog') + (move ? ' move' : '');
        const g = tl.revealed ? S.TILE_GLYPH[tl.type] : '?';
        html += `<div class="${cls}" data-x="${x}" data-y="${y}">${isP ? '●' : g}</div>`;
      }
      html += '</div>';
    }
    return html;
  }

  // ---------- combat ----------
  function combatIntro() {
    const st = Game.status();
    screen.innerHTML = `
      ${bar('scattering://field', `day ${st.day} · ⚠`)}
      ${statusBars(st)}
      <h1 class="title" style="font-size:22px">⚠ BULLDOZER ⚠</h1>
      <p class="small">It crashes from the thicket. It is not going around.</p>
      <div class="log">${st.log.slice(-3).map(l => `<p class="term-line">${esc(l)}</p>`).join('')}</div>
      <button class="btn" id="b-fight">Face it</button>`;
    document.getElementById('b-fight').onclick = () => { Game.startCombat(); combatScreen(); };
  }
  function combatScreen() {
    const st = Game.status();
    const f = Game.fight;
    if (!f) return gameMain();
    const mv = S.combat.MOVES[f.telegraph];
    screen.innerHTML = `
      ${bar('scattering://combat', `round ${f.round + 1}`)}
      ${statusBars(st)}
      <h1 class="title" style="font-size:22px">${f.monster.name.toUpperCase()}</h1>
      ${statRow('BULLDOZER', f.monster.hp + ' hp', f.monster.hp / f.monster.maxHp * 100, f.monster.hp < 15)}
      <div class="card warn"><h3>⚠ ${mv.name} incoming</h3><p class="small">${f.studied ? mv.hint : "It shifts — you can't quite read it. (STUDY it.)"}</p></div>
      <div class="actions">
        <button class="btn sm" data-c="strike">STRIKE</button>
        <button class="btn sm" data-c="harry">HARRY</button>
        <button class="btn sm" data-c="brace">BRACE</button>
      </div>
      <div class="actions">
        <button class="btn sm ghost" data-c="study">STUDY</button>
        <button class="btn sm ghost" data-c="flee">FLEE</button>
      </div>
      <div class="log">${f.log.slice(-4).map(l => `<p class="term-line">${esc(l)}</p>`).join('')}</div>`;
    screen.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      Game.combatRound(b.dataset.c);
      const s2 = Game.status();
      if (s2.over) return ending();
      if (!Game.fight) return gameMain();
      combatScreen();
    });
  }

  // ---------- codex ----------
  function codexScreen() {
    const entries = Game.codexEntries();
    const mons = Game.state.codex.monsters || {};
    screen.innerHTML = `
      ${bar('scattering://codex', entries.length + ' entries')}
      <h1 class="title" style="font-size:22px">CODEX</h1>
      <p class="small"><i>field journal — your handwriting. what you learned, the village keeps.</i></p>
      ${entries.length ? entries.map(e => `
        <div class="card codex"><h3>${e.name} <span class="small">· ${e.kcal} kcal/${e.unit}</span></h3>
        <p class="small"><b>Prep:</b> ${e.prep || '—'}</p><p>${e.text}</p></div>`).join('')
        : '<div class="card"><h3>No entries yet.</h3><p>Forage something. Survive it. Write it down.</p></div>'}
      ${Object.keys(mons).length ? '<h1 class="title" style="font-size:18px">BEASTS</h1>' + Object.entries(mons).map(([id, m]) => {
        const md = Game.data.monsters.find(x => x.id === id);
        return `<div class="card codex"><h3>${md.name}</h3><p class="small">System files it as: ${md.systemDesignation || '—'}</p><p>${esc(md.codexStages[m.stage] || '')}</p></div>`;
      }).join('') : ''}
      <button class="btn ghost" id="b-back">Back to field</button>`;
    document.getElementById('b-back').onclick = () => gameMain();
  }

  // ---------- ending ----------
  function ending() {
    const st = Game.status();
    const entries = Game.codexEntries().length;
    screen.innerHTML = `
      ${bar('scattering://end', st.won ? 'survived' : 'fallen')}
      <h1 class="title" style="font-size:26px">${st.won ? 'SEVEN DAYS' : 'THE WOODS KEEP YOU'}</h1>
      <p class="small">${st.won
        ? 'You ate. You drank. You came back. The village eats because of you.'
        : 'You didn\'t make it. The village remembers. The Codex keeps what you brought home.'}</p>
      <div class="card"><h3>Expedition record</h3>
        <p class="small">Days: ${st.day} / 7 · Plants learned: ${entries}<br>
        ${st.won ? 'The first week is the hardest. It gets no easier — but you get better.' : 'Someone else will carry the journal next time.'}</p></div>
      <button class="btn" id="b-again">New expedition</button>
      <button class="btn ghost" id="b-title">Title</button>`;
    document.getElementById('b-again').onclick = () => title();
    document.getElementById('b-title').onclick = () => title();
  }

  // ---------- boot ----------
  Game.init().then(() => title()).catch(e => {
    screen.innerHTML = `<p class="small">Failed to load game data: ${esc(e.message)}<br>Serve over http (not file://) for fetch() to work.</p>`;
  });
})();
</script>
</body>
</html>
